openapi: 3.0.1
info:
  description: This is the sipgate REST API documentation. We build our applications
    on this API and we invite you to use it too.
  title: sipgate API
  version: 2.0.0
servers:
- url: https://api.sipgate.com/v2
tags:
- name: account
- name: addresses
- name: app
- name: authorization
- name: blacklist
- name: callrestrictions
- name: contacts
- name: devices
- name: faxlines
- name: groups
- name: history
- name: log
- name: notifications
- name: numbers
- name: phonelines
- name: portings
- name: restrictions
- name: rtcm
- name: sessions
- name: settings
- name: sms
- name: urls
- name: users
- name: voicemails
paths:
  /:
    get:
      operationId: getUrls
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiUrlsResponse"
          description: successful operation
      summary: Get all top level API URLs
      tags:
      - urls
  /account:
    get:
      operationId: getAccount
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
          description: successful operation
        "404":
          content: {}
          description: Account not found
      security:
      - oauth2:
        - all
        - account:read
      summary: Get account data
      tags:
      - account
  /account/verified:
    put:
      operationId: verify
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/AccountVerificationRequest"
        required: false
      responses:
        "204":
          content: {}
          description: Account verified
        "400":
          content: {}
          description: Missing verification code
        "404":
          content: {}
          description: Verification code not found
      security:
      - oauth2:
        - all
        - account:write
      summary: Verify your account
      tags:
      - account
      x-codegen-request-body-name: body
  /addresses:
    get:
      operationId: getAddresses
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressesResponse"
          description: successful operation
      security:
      - oauth2:
        - all
        - addresses:read
      summary: List all addresses
      tags:
      - addresses
  /addresses/itemCount:
    get:
      operationId: getItemCount
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCountResponse"
          description: successful operation
      security:
      - oauth2:
        - all
        - addresses:read
      summary: Get amount of addresses
      tags:
      - addresses
  /addresses/{addressId}:
    get:
      operationId: getAddress
      parameters:
      - description: The unique address identifier
        example: 123
        in: path
        name: addressId
        required: true
        schema:
          format: int32
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressResponse"
          description: successful operation
      security:
      - oauth2:
        - all
        - addresses:read
      summary: Get a specific address
      tags:
      - addresses
    put:
      description: "<strong>Warning:</strong> Depending on your country of residence,\
        \ a change of your address may lead to the deactivation of associated telephone\
        \ numbers."
      operationId: modifyAddress
      parameters:
      - description: The unique address identifier
        example: 123
        in: path
        name: addressId
        required: true
        schema:
          format: int32
          type: integer
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/ModifyAddressRequest"
        required: false
      responses:
        "204":
          content: {}
          description: Address updated
        "400":
          content: {}
          description: Bad request
        "500":
          content: {}
          description: Address could not be updated
      security:
      - oauth2:
        - all
        - addresses:write
      summary: Update an existing address
      tags:
      - addresses
      x-codegen-request-body-name: body
  /addresses/{addressId}/numbers:
    get:
      operationId: getAddressNumbers
      parameters:
      - description: The unique address identifier
        example: 123
        in: path
        name: addressId
        required: true
        schema:
          format: int32
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumbersResponse"
          description: successful operation
      security:
      - oauth2:
        - all
        - numbers:read
      summary: List all phone numbers of a specific address
      tags:
      - addresses
  /app/events:
    get:
      operationId: getEvents
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EventsResponse"
          description: successful operation
      security:
      - oauth2:
        - internal
      summary: List all active events for this account
      tags:
      - app
  /app/events/{id}:
    delete:
      operationId: deleteEvent
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int32
          type: integer
      responses:
        "204":
          content: {}
          description: Event deleted
        "403":
          content: {}
          description: Sticky events cannot be deleted
        "404":
          content: {}
          description: Event not found
      security:
      - oauth2:
        - internal
      summary: Delete a specific event
      tags:
      - app
  /app/links:
    get:
      operationId: getLinks
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinksResponse"
          description: successful operation
        "500":
          content: {}
          description: Links could not be determined for this account
      summary: List all external URLs of app.sipgate.com
      tags:
      - app
  /app/properties:
    get:
      operationId: getProperties
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertiesResponse"
          description: successful operation
        "500":
          content: {}
          description: Account not found or account state error
      security:
      - oauth2:
        - all
        - internal
      summary: List all properties of app.sipgate.com
      tags:
      - app
  /app/tacs:
    get:
      operationId: getTac
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TacResponse"
          description: successful operation
        "500":
          content: {}
          description: Account not found
      security:
      - oauth2:
        - internal
      summary: Check if terms and conditions have been accepted
      tags:
      - app
  /app/users:
    get:
      operationId: getUsers
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersResponse"
          description: successful operation
      security:
      - oauth2:
        - internal
      summary: "Fetch all users with numbers, addresses and call restrictions"
      tags:
      - app
  /authorization/oauth2/clients:
    get:
      operationId: getClients
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClients"
          description: Success
      security:
      - oauth2:
        - all
        - authorization:oauth2:clients:read
      summary: List all OAuth 2.0 clients
      tags:
      - authorization
      x-accepts: application/json
      x-contentType: application/json
    post:
      operationId: createClient
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/createClient_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClient"
          description: Success
      security:
      - oauth2:
        - all
        - authorization:oauth2:clients:write
      summary: Create a new OAuth 2.0 client
      tags:
      - authorization
      x-accepts: application/json
      x-contentType: application/json
      x-codegen-request-body-name: client
  /authorization/oauth2/clients/{clientId}:
    delete:
      operationId: deleteClient
      parameters:
      - description: The unique OAuth 2.0 client identifier
        in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        "202":
          content: {}
          description: Deletion request accepted
      security:
      - oauth2:
        - all
        - authorization:oauth2:clients:write
      summary: Delete an existing OAuth 2.0 client
      tags:
      - authorization
      x-accepts: application/json
      x-contentType: application/json
    get:
      operationId: getClient
      parameters:
      - description: The unique OAuth 2.0 client identifier
        in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClient"
          description: Success
      security:
      - oauth2:
        - all
        - authorization:oauth2:clients:read
      summary: Get a specific OAuth 2.0 client
      tags:
      - authorization
      x-accepts: application/json
      x-contentType: application/json
    put:
      operationId: updateClient
      parameters:
      - description: The unique OAuth 2.0 client identifier
        in: path
        name: clientId
        required: true
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/createClient_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClient"
          description: Success
      security:
      - oauth2:
        - all
        - authorization:oauth2:clients:write
      summary: Update an existing OAuth 2.0 client
      tags:
      - authorization
      x-accepts: application/json
      x-contentType: application/json
      x-codegen-request-body-name: client
  /authorization/oauth2/clients/{clientId}/gdpr:
    get:
      operationId: getGdprUrls
      parameters:
      - description: The unique OAuth 2.0 client identifier
        in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GdprUrls"
          description: Success
      summary: Get GDPR urls for specific OAuth 2.0 client
      tags:
      - authorization
      x-accepts: application/json
      x-contentType: application/json
  /authorization/userinfo:
    get:
      operationId: userinfo
      parameters:
      - description: Basic <base64 token>
        in: header
        name: Authorization
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserinfoResponse"
          description: successful operation
        "401":
          content: {}
          description: Invalid token supplied
      summary: Get information about the logged in user
      tags:
      - authorization
  /autorecordings/greetings:
    get:
      description: Returns the current greeting for automated call recordings. Requires
        admin privileges and an activated call recording account.
      operationId: getGreeting
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GreetingResponse"
          description: Success
      security:
      - oauth2:
        - autorecording:greeting:read
        - all
      summary: Fetch the current automated call recording greeting
      tags:
      - autorecordings
    post:
      description: Replaces the current greeting with the provided audio file. Requires
        admin privileges and an activated call recording account.
      operationId: addGreeting
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGreetingRequest"
        required: true
      responses:
        "200":
          content: {}
          description: OK
      security:
      - oauth2:
        - autorecording:greeting:write
        - all
      summary: Save a greeting to be used for automated call recordings
      tags:
      - autorecordings
      x-codegen-request-body-name: body
  /autorecordings/greetings/{greetingId}:
    delete:
      description: Deletes the specified greeting. Requires admin privileges and an
        activated call recording account.
      operationId: deleteGreeting
      parameters:
      - description: The unique greeting identifier
        example: 42
        in: path
        name: greetingId
        required: true
        schema:
          type: string
      responses:
        "200":
          content: {}
          description: OK
      security:
      - oauth2:
        - autorecording:greeting:write
        - all
      summary: Delete the greeting used for automated call recordings
      tags:
      - autorecordings
  /autorecordings/{extension}/settings:
    get:
      description: "Get recording settings for an endpoint. Currently only register\
        \ endpoints are supported. The masterSipId is derived from the authenticated\
        \ webuser context and doesn't need to be provided in the request. Returns\
        \ 200 OK with the recording settings on success, 400 Bad Request if the request\
        \ is invalid, and 404 Not Found if the extension does not exist or call recording\
        \ is not activated for the account."
      operationId: getRecordingSettingForEndpoint
      parameters:
      - in: path
        name: extension
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionSettingsResponse"
          description: Success
      security:
      - oauth2:
        - devices:read
        - all
      summary: Get recording settings for an endpoint
      tags:
      - autorecordings
    put:
      description: "Update recording settings for an endpoint. Currently only register\
        \ endpoints are supported. The masterSipId is derived from the authenticated\
        \ webuser context and doesn't need to be provided in the request. Returns\
        \ 204 No Content on success, 400 Bad Request if the request is invalid, and\
        \ 404 Not Found if the extension does not exist or call recording is not activated\
        \ for the account."
      operationId: updateRecordingSettingForEndpoint
      parameters:
      - in: path
        name: extension
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExtensionSettingsRequest"
        required: true
      responses:
        "200":
          content: {}
          description: OK
      security:
      - oauth2:
        - devices:read
        - all
      summary: Update recording settings for an endpoint
      tags:
      - autorecordings
      x-codegen-request-body-name: body
  /balance:
    get:
      operationId: getBalance
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
          description: successful operation
        "500":
          content: {}
          description: Balance could not be retrieved
      security:
      - oauth2:
        - all
        - balance:read
      summary: Get the account balance
      tags:
      - account
  /blacklist/incoming:
    get:
      operationId: getIncomingEntries
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomingEntries"
          description: successful operation
      security:
      - oauth2:
        - all
        - blacklist:read
      summary: Get your incoming blacklist entries
      tags:
      - blacklist
    post:
      operationId: addIncomingEntry
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomingEntry"
        description: "Incoming blacklist entry. Recommended request format for phoneNumber\
          \ is E.164 format without leading +. Entries are stored with a leading +\
          \ and returned that way. Do not use national numbers with leading 0, e.g.\
          \ use 49151... instead of 0151...."
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomingEntry"
          description: successful operation
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomingEntry"
          description: successful operation
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid phoneNumber supplied
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: IncomingEntry already exists
      security:
      - oauth2:
        - all
        - blacklist:write
      summary: Create a new incoming blacklist entry
      tags:
      - blacklist
      x-codegen-request-body-name: body
  /blacklist/incoming/{phoneNumber}:
    delete:
      description: "Recommended request format for phoneNumber is E.164 format without\
        \ leading +, e.g. 492117654321. Entries are stored with a leading +. Do not\
        \ use national numbers with leading 0, e.g. use 49151... instead of 0151...."
      operationId: removeIncomingEntry
      parameters:
      - in: path
        name: phoneNumber
        required: true
        schema:
          type: string
      responses:
        "204":
          content: {}
          description: successful operation
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid phoneNumber supplied
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: IncomingEntry not found
      security:
      - oauth2:
        - all
        - blacklist:write
      summary: Delete an incoming blacklist entry
      tags:
      - blacklist
  /callrestrictions:
    get:
      operationId: getCallRestrictions
      parameters:
      - description: List of extensions
        explode: true
        in: query
        name: userIds
        schema:
          items:
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallRestrictionResponse"
          description: successful operation
        "404":
          content: {}
          description: User not found
      security:
      - oauth2:
        - all
        - callrestrictions:read
      summary: Get call restrictions data
      tags:
      - callrestrictions
  /calls:
    get:
      description: "Note: for Neo PBX accounts the values for muted and hold are always\
        \ false."
      operationId: getCalls
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calls"
          description: Success
        "500":
          content: {}
          description: Internal server error
      security:
      - oauth2:
        - all
        - rtcm:read
      summary: List all currently established calls. The response does not contain
        ringing calls or currently running voicemail recordings.
      tags:
      - rtcm
    post:
      operationId: createCall
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createCall_request"
        description: call parameters
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCallResponse"
          description: Call initiated successfully
        "400":
          content: {}
          description: Invalid request parameters
        "500":
          content: {}
          description: Internal server error
      security:
      - oauth2:
        - all
        - rtcm:write
      summary: Start a new channel call for sipgate neo accounts
      tags:
      - rtcm
      x-codegen-request-body-name: body
  /calls/{callId}:
    delete:
      operationId: hangupCall
      parameters:
      - in: path
        name: callId
        required: true
        schema:
          type: string
      responses:
        "204":
          content: {}
          description: Success
        "400":
          content: {}
          description: Bad request
        "404":
          content: {}
          description: Call not found
      security:
      - oauth2:
        - all
        - rtcm:write
      summary: Hang up call
      tags:
      - rtcm
  /calls/{callId}/announcements:
    post:
      description: "Note: This functionality is not available for Neo PBX accounts.\
        \ Currently the sound file needs to be a mono 16bit PCM WAV file with a sampling\
        \ rate of 8kHz. MP3 conversion example: mpg123 --rate 8000 --mono -w output.wav\
        \ input.mp3"
      operationId: startCallAnnouncement
      parameters:
      - in: path
        name: callId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementRequest"
        required: false
      responses:
        "204":
          content: {}
          description: Success
        "400":
          content: {}
          description: Bad request
        "404":
          content: {}
          description: Call not found
      security:
      - oauth2:
        - all
        - rtcm:write
      summary: Start playing a new announcement to all participants
      tags:
      - rtcm
      x-codegen-request-body-name: body
  /calls/{callId}/dtmf:
    post:
      operationId: sendCallDtmf
      parameters:
      - in: path
        name: callId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DtmfRequest"
        required: false
      responses:
        "204":
          content: {}
          description: Success
        "400":
          content: {}
          description: Bad request
        "404":
          content: {}
          description: Call not found
      security:
      - oauth2:
        - all
        - rtcm:write
      summary: Send DTMF tone sequences to all participants
      tags:
      - rtcm
      x-codegen-request-body-name: body
  /calls/{callId}/hold:
    put:
      operationId: setCallHold
      parameters:
      - in: path
        name: callId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BooleanRequest"
        required: false
      responses:
        "204":
          content: {}
          description: Success
        "400":
          content: {}
          description: Bad request
        "404":
          content: {}
          description: Call not found
        "409":
          content: {}
          description: Call not yet established
      security:
      - oauth2:
        - all
        - rtcm:write
      summary: Hold/Resume all participants
      tags:
      - rtcm
      x-codegen-request-body-name: body
  /calls/{callId}/muted:
    put:
      description: "Note: This functionality is not available for Neo PBX accounts."
      operationId: setCallMuted
      parameters:
      - in: path
        name: callId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BooleanRequest"
        required: false
      responses:
        "204":
          content: {}
          description: Success
        "400":
          content: {}
          description: Bad request
        "404":
          content: {}
          description: Call not found
      security:
      - oauth2:
        - all
        - rtcm:write
      summary: Mute/Unmute yourself
      tags:
      - rtcm
      x-codegen-request-body-name: body
  /calls/{callId}/recording:
    put:
      description: "When starting a recording with announcement=false, no announcement\
        \ will be played to call participants. It is within your responsibility to\
        \ inform all call participants about the recording. For Neo PBX accounts,\
        \ the recording will always be stopped with the same announcement setting\
        \ as it was started with."
      operationId: setCallRecording
      parameters:
      - in: path
        name: callId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordingRequest"
        required: false
      responses:
        "204":
          content: {}
          description: Success
        "400":
          content: {}
          description: Bad request
        "404":
          content: {}
          description: Call not found
      security:
      - oauth2:
        - all
        - rtcm:write
      summary: Start or stop a call recording
      tags:
      - rtcm
      x-codegen-request-body-name: body
  /calls/{callId}/transfer:
    post:
      operationId: transferCall
      parameters:
      - in: path
        name: callId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
        required: false
      responses:
        "204":
          content: {}
          description: Success
        "400":
          content: {}
          description: Bad request
        "404":
          content: {}
          description: Call not found
        "409":
          content: {}
          description: Call is still being established
      security:
      - oauth2:
        - all
        - rtcm:write
      summary: Transfer call
      tags:
      - rtcm
      x-codegen-request-body-name: body
  /channels:
    get:
